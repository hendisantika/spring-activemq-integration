# Build & test all modules with Maven on JDK 25
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write # required by the dependency submission step

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # person-obj is a shared dependency of consumer & publisher, so install it first
      - name: Build & install person-obj (schema)
        run: mvn -B install --file person-app/pom.xml

      - name: Build & test publisher
        run: mvn -B verify --file publisher/pom.xml

      - name: Build & test consumer
        run: mvn -B verify --file consumer/pom.xml

  dependency-graph:
    # Uploads the dependency graph to GitHub to improve Dependabot alerts (push to master only)
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ person-app, publisher, consumer ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install person-obj
        run: mvn -B -DskipTests install --file person-app/pom.xml

      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: ${{ matrix.module }}
          ignore-maven-wrapper: true
          correlator: ${{ github.job }}-${{ matrix.module }}
